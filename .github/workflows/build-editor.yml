name: Build Editor

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        working-directory: editor
        run: npm ci

      - name: Build
        working-directory: editor
        run: npm run build
        env:
          VITE_AUTH_HASH: ${{ secrets.VITE_AUTH_HASH }}

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio-site/
          git diff --staged --quiet || git commit -m "Build editor [skip ci]"
          git push
